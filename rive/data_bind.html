<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>v1.3 Bitcoin Live Data Bind</title>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      height: 100vh;
    }
    canvas {
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    const riveCanvas = document.getElementById("riveCanvas");

    const riveInstance = new rive.Rive({
      src: "data_bind.riv",
      canvas: riveCanvas,
      autoplay: true,
      onLoad: async () => {
        console.log("✅ Rive file loaded successfully!");

        // Grab the active artboard
        const artboard = riveInstance.contents?.[0];
        if (!artboard) {
          console.error("❌ Could not access artboard contents!");
          return;
        }

        // Try to locate data bindings from the artboard
        const dataBindings = artboard.dataBindings || artboard.dataBind;
        if (!dataBindings) {
          console.error("❌ This Rive runtime or file has no data binding interface available.");
          return;
        }

        // Try to get the view model
        const viewModel =
          dataBindings.viewModel?.("View Model 1") ||
          dataBindings.getViewModel?.("View Model 1");

        if (!viewModel) {
          console.error("❌ View Model 'View Model 1' not found!");
          return;
        }

        // Try to get the property
        const numProperty =
          viewModel.input?.("num") ||
          viewModel.getNumber?.("num");

        if (!numProperty) {
          console.error("❌ Property 'num' not found in View Model 1!");
          return;
        }

        console.log("🔗 Bound successfully to 'View Model 1.num'!");

        // Fetch live Bitcoin price
        async function updateBitcoinPrice() {
          try {
            const response = await fetch("https://api.coindesk.com/v1/bpi/currentprice/USD.json");
            const data = await response.json();
            const price = data.bpi.USD.rate_float;

            console.log("💰 BTC Price:", price);
            numProperty.value = price;
          } catch (err) {
            console.error("⚠️ Error fetching BTC data:", err);
          }
        }

        await updateBitcoinPrice();
        setInterval(updateBitcoinPrice, 10000);
      },
    });
  </script>
</body>
</html>
