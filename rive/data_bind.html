<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v1.7 Rive Data Binding Example</title>
  <script type="module">
    import Rive from "https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.21.4/+esm";

    const canvas = document.getElementById("riveCanvas");

    const riveFile = new Rive({
      src: "data_bind.riv", // Make sure this path is correct
      canvas: canvas,
      autoplay: true,
      onLoad: () => {
        console.log("Rive file loaded");
        const vm = riveFile.stateMachineInputs("View Model 1");
        const numProperty = vm.find(i => i.name === "num");

        async function fetchBitcoinPrice() {
          try {
            const res = await fetch("https://api.coindesk.com/v1/bpi/currentprice/USD.json");
            const data = await res.json();
            const price = parseFloat(data.bpi.USD.rate.replace(",", ""));
            console.log("Bitcoin price:", price);
            return price;
          } catch (e) {
            console.error("Fetch error:", e);
            return null;
          }
        }

        async function updateNumber() {
          const newVal = await fetchBitcoinPrice();
          if (newVal && numProperty) {
            numProperty.value = newVal;
          }
        }

        // Initial fetch
        updateNumber();
        // Update every 10 seconds
        setInterval(updateNumber, 10000);
      },
    });
  </script>
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#111;">
  <canvas id="riveCanvas" width="500" height="500"></canvas>
</body>
</html>
