<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>v2.0 Bitcoin Live Data Bind</title>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #011029;
    }
    canvas {
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 64, 255, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    const r = new rive.Rive({
      src: "data_bind.riv",
      canvas: document.getElementById("riveCanvas"), // ✅ FIXED ID (you had rive-canvas)
      autoplay: true,
      autoBind: true,
      artboard: "Artboard", // ✅ only include if your Rive has multiple artboards
      stateMachines: "State Machine 1", // ✅ optional, helps autoBind link View Model to correct state machine
      onLoad: async () => {
        console.log("✅ Rive file loaded successfully!");

        // Wait a bit to ensure data binding completes
        await new Promise((rslv) => setTimeout(rslv, 500));

        const vmi = r.viewModelInstance;
        if (!vmi) {
          console.error("❌ No ViewModelInstance found — check autoBind and artboard/state machine names!");
          return;
        }

        // Check that the 'num' property exists
        const numProp = vmi.number("num");
        if (!numProp) {
          console.error("❌ Number property 'num' not found in ViewModelInstance!");
          console.log("Available properties:", vmi);
          return;
        }

        console.log("🔗 Bound to property 'num' successfully!");

        async function updateBitcoinPrice() {
          try {
            const response = await fetch("https://api.coinbase.com/v2/prices/spot?currency=USD");
            const data = await response.json();
            const price = parseFloat(data.data.amount);

            console.log("💰 BTC Price:", price);
            numProp.value = price; // updates Rive
          } catch (error) {
            console.error("⚠️ Error fetching Bitcoin data:", error);
          }
        }

        // Initial fetch
        await updateBitcoinPrice();
        // Refresh every 10 seconds
        setInterval(updateBitcoinPrice, 10000);
      },
    });
  </script>
</body>
</html>
