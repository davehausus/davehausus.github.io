<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Live Data Bind</title>
  <style>
    /* Run 1 → RobotoCondensed-Italic (400 italic) */
    @font-face {
      font-family: "RobotoCondensed-Italic";
      src: url("https://fonts.gstatic.com/s/robotocondensed/v35/pxiRyp8kv8JHgFVrJJLmE4tC.woff2")
           format("woff2");
      font-weight: 400;
      font-style: italic;
    }

    /* Run 2 → RobotoCondensed-ExtraBoldItalic (800 italic) */
    @font-face {
      font-family: "RobotoCondensed-ExtraBoldItalic";
      src: url("https://fonts.gstatic.com/s/robotocondensed/v35/pxiZyp8kv8JHgFVrJJLmE0tNKaMX.woff2")
           format("woff2");
      font-weight: 800;
      font-style: italic;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background: #011029;
    }

    canvas {
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 64, 255, 0.3);
    }
  </style>

  <script src="https://unpkg.com/@rive-app/webgl2"></script>
</head>

<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    const r = new rive.Rive({
      src: "data_bind.riv",
      canvas: document.getElementById("riveCanvas"),
      autoplay: true,
      autoBind: true,
      artboard: "Artboard",
      stateMachines: "State Machine 1",

      onLoad: async () => {
        console.log("✅ Rive file loaded successfully!");

        await new Promise((rslv) => setTimeout(rslv, 300));

        const vmi = r.viewModelInstance;
        if (!vmi) {
          console.error("❌ No ViewModelInstance found — check autoBind and artboard/state machine names!");
          return;
        }

        const numProp = vmi.number("num");
        if (!numProp) {
          console.error("❌ Number property 'num' not found in ViewModelInstance!");
          console.log("Available properties:", vmi);
          return;
        }

        console.log("🔗 Bound to property 'num' successfully!");

        async function updateBitcoinPrice() {
          try {
            const response = await fetch("https://api.coinbase.com/v2/prices/spot?currency=USD");
            const data = await response.json();
            const price = parseFloat(data.data.amount);

            console.log("💰 BTC Price:", price);
            numProp.value = price;
          } catch (error) {
            console.error("⚠️ Error fetching Bitcoin data:", error);
          }
        }

        await updateBitcoinPrice();
        setInterval(updateBitcoinPrice, 2000);
      },
    });
  </script>
</body>
</html>
