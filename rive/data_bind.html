<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>v1.1 Bitcoin Live Data Bind</title>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      height: 100vh;
    }
    canvas {
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    const riveCanvas = document.getElementById("riveCanvas");

    // Initialize the Rive animation
    const riveInstance = new rive.Rive({
      src: "data_bind.riv", // ensure this file is in the same directory
      canvas: riveCanvas,
      autoplay: true,
      onLoad: async () => {
        console.log("✅ Rive file loaded successfully!");

        // Access the ViewModel named "View Model 1"
        const viewModel = riveInstance.dataBind.getViewModel("View Model 1");
        if (!viewModel) {
          console.error("❌ View Model 'View Model 1' not found in Rive file!");
          return;
        }

        const numProperty = viewModel.getNumber("num");
        if (!numProperty) {
          console.error("❌ Number property 'num' not found in View Model 1!");
          return;
        }

        console.log("🔗 Bound to property 'num' successfully!");

        // Function to fetch Bitcoin price and update Rive
        async function updateBitcoinPrice() {
          try {
            // Public CORS-enabled API (Coindesk)
            const response = await fetch("https://api.coindesk.com/v1/bpi/currentprice/USD.json");
            const data = await response.json();
            const price = data.bpi.USD.rate_float;

            console.log("💰 BTC Price:", price);
            numProperty.value = price; // Update the bound number in Rive
          } catch (error) {
            console.error("⚠️ Error fetching Bitcoin data:", error);
          }
        }

        // Fetch immediately on load
        await updateBitcoinPrice();

        // Then update every 10 seconds
        setInterval(updateBitcoinPrice, 10000);
      }
    });
  </script>
</body>
</html>
