<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>v1.2 Data Binding</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #riveCanvas {
      width: 428px;
      height: 926px;
    }
    .status {
      margin-top: 10px;
      color: #8b949e;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <canvas id="riveCanvas" width="428" height="926"></canvas>
  <div class="status" id="statusText">Loading Bitcoin price…</div>

  <script src="https://unpkg.com/@rive-app/canvas@2.15.0"></script>
<script>
  const riveFileUrl = "data_bind.riv";
  const status = document.getElementById("statusText");

  const riveInstance = new rive.Rive({
    src: riveFileUrl,
    canvas: document.getElementById("riveCanvas"),
    autoplay: true,
    onLoad: () => {
      console.log("✅ Rive loaded");
      updateNumber();
      setInterval(updateNumber, 10000);
    },
    onLoadError: (err) => {
      console.error("❌ Failed to load:", err);
      status.textContent = "⚠️ Couldn't load .riv file";
    }
  });

  async function fetchBitcoinPrice() {
    const res = await fetch("https://api.coindesk.com/v1/bpi/currentprice.json");
    const data = await res.json();
    return data.bpi.USD.rate_float;
  }

  async function updateNumber() {
    try {
      const val = await fetchBitcoinPrice();
      const viewModel = riveInstance.viewModel("View Model 1");
      if (viewModel && viewModel.has("num")) {
        viewModel.setNumber("num", val);
        console.log("💹 Updated num:", val);
        status.textContent = `Bitcoin: $${val.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
      } else {
        status.textContent = "⚠️ Missing ViewModel or property";
      }
    } catch (err) {
      console.error("Fetch error:", err);
      status.textContent = "⚠️ Failed to fetch data";
    }
  }
</script>

</body>
</html>
