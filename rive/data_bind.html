<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v1.4 Rive Data Binding Test</title>
  <style>
    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #ccc;
      font-family: sans-serif;
    }
    canvas {
      width: 428px;
      height: 926px;
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas"></canvas>
  <script type="module">
    import Rive from 'https://unpkg.com/@rive-app/canvas@2.21.4';

    const canvas = document.getElementById('riveCanvas');

    // Load your Rive file (ensure this path is correct)
    const rive = new Rive({
      src: 'data_bind.riv',
      canvas,
      autoplay: true,
      onLoad: () => {
        console.log('✅ Rive file loaded.');

        // Fetch and update data every 10 seconds
        updateNumber();
        setInterval(updateNumber, 10000);
      },
    });

    async function fetchCryptoPrice() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
        const data = await res.json();
        return data.bitcoin.usd;
      } catch (err) {
        console.error('❌ Fetch error:', err);
        return null;
      }
    }

    async function updateNumber() {
      const price = await fetchCryptoPrice();
      if (price && rive?.viewModelInputs) {
        const vm = rive.viewModelInputs('View Model 1');
        if (vm && vm.num) {
          vm.num.value = price;
          console.log('💰 Updated Rive number to:', price);
        } else {
          console.warn('⚠️ Could not find ViewModel or num property.');
        }
      }
    }
  </script>
</body>
</html>
