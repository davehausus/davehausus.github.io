<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>v1.6 Bitcoin Live Data Bind</title>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      height: 100vh;
    }
    canvas {
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    const r = new rive.Rive({
      src: "data_bind.riv",
      canvas: document.getElementById("rive-canvas"),
      autoplay: true,
      autoBind: true,
      artboard: 'Artboard',
      stateMachines: 'State Machine 1',
      onLoad: async () => {
        console.log("✅ Rive file loaded successfully!");

        const vmi = r.viewModelInstance


        console.log("🔗 Bound to property 'num' successfully!");

        async function updateBitcoinPrice() {
          try {
            const response = await fetch("https://api.coindesk.com/v1/bpi/currentprice/USD.json");
            const data = await response.json();
            const price = data.bpi.USD.rate_float;

            console.log("💰 BTC Price:", price);
            vmi.number('num').value = 'price'; // Update the number input in Rive
          } catch (error) {
            console.error("⚠️ Error fetching Bitcoin data:", error);
          }
        }

        // Initial fetch
        await updateBitcoinPrice();
        // Refresh every 10 seconds
        setInterval(updateBitcoinPrice, 10000);
      }
    });
  </script>
</body>
</html>
