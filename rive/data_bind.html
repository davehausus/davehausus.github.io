<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- CSS FILES -->
<link rel="stylesheet" href="../../css/animate.min.css">
<link rel="stylesheet" href="../../css/swiper.min.css">
<link rel="stylesheet" href="../../css/bootstrap.min.css">
<link rel="stylesheet" href="../../css/style.css">
  <title>v1.17 Data Bind</title>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background-color: #212E44;
    }
  </style>
</head>

<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    let riveInstance;

    // Load the "Artboard" artboard and "State Machine 1"
    riveInstance = new rive.Rive({
      src: "downloading_updates.riv", // Replace with your .riv file path
      canvas: document.getElementById("riveCanvas"),
      autoplay: true,
      artboard: "Artboard", // Explicitly set the artboard
      stateMachines: ["State Machine 1"], // The single state machine
      onLoad: () => {
        console.log("Rive file loaded: Artboard + State Machine 1");
      }
    });

          const inputs = riveInstance.stateMachineInputs('View Model 1');
          const numProp = inputs.find(i => i.name === 'num');

          async function fetchBitcoinPrice() {
            try {
              const response = await fetch('https://api.coindesk.com/v1/bpi/currentprice/USD.json');
              const data = await response.json();
              return parseFloat(data.bpi.USD.rate.replace(',', ''));
            } catch (err) {
              console.error('Fetch error:', err);
              return null;
            }
          }

          async function updateNumber() {
            const price = await fetchBitcoinPrice();
            if (price !== null && numProp) {
              numProp.value = price;
              console.log('Updated Rive num:', price);
            }
          }

          updateNumber();
          setInterval(updateNumber, 10000);
        },
        onLoadError: (err) => {
          console.error('Failed to load Rive file:', err);
        }
      });
    }
  </script>
</body>
</html>
