<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v1.8 Rive Data Binding Example</title>
  <script type="module">
    import { Rive } from "https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.21.4/+esm";

    const canvas = document.getElementById("riveCanvas");

    const riveFile = new Rive({
      src: "data_bind.riv", // your Rive file path
      canvas: canvas,
      autoplay: true,
      onLoad: () => {
        console.log("Rive loaded!");
        const vmInputs = riveFile.stateMachineInputs("View Model 1");
        const numProp = vmInputs.find(i => i.name === "num");

        async function fetchBitcoinPrice() {
          try {
            const res = await fetch("https://api.coindesk.com/v1/bpi/currentprice/USD.json");
            const data = await res.json();
            return parseFloat(data.bpi.USD.rate.replace(",", ""));
          } catch (e) {
            console.error("Fetch error:", e);
            return null;
          }
        }

        async function updateNumber() {
          const price = await fetchBitcoinPrice();
          if (price && numProp) {
            numProp.value = price;
            console.log("Updated Rive num:", price);
          }
        }

        updateNumber();
        setInterval(updateNumber, 10000); // every 10 seconds
      }
    });
  </script>
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#111;">
  <canvas id="riveCanvas" width="500" height="500"></canvas>
</body>
</html>
