<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v1.18 Rive Data Binding (UMD + GitHub)</title>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #212E44;
      margin: 0;
      flex-direction: column;
    }
    canvas { border: 1px solid #fff; }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    // Check if Rive UMD is loaded
    if (typeof rive === 'undefined') {
      console.error("Rive UMD not loaded!");
    } else {
      console.log("Rive UMD loaded!");

      const riveInstance = new rive.Rive({
        src: "https://davehausus.github.io/rive/data_binding.riv", // Absolute URL
        canvas: document.getElementById("riveCanvas"),
        autoplay: true,
        artboard: "Artboard",
        stateMachines: ["State Machine 1"],
        crossorigin: "anonymous", // Important for GitHub-hosted files
        onLoad: () => {
          console.log("Rive file loaded successfully!");

          // Get state machine inputs
          const inputs = riveInstance.stateMachineInputs("View Model 1");
          const numProp = inputs.find(i => i.name === "num");

          // Fetch Bitcoin price from CORS-friendly API
          async function fetchBitcoinPrice() {
            try {
              const response = await fetch('https://api.coindesk.com/v1/bpi/currentprice/USD.json');
              const data = await response.json();
              return parseFloat(data.bpi.USD.rate.replace(',', ''));
            } catch (err) {
              console.error("Fetch error:", err);
              return null;
            }
          }

          // Update the Rive input
          async function updateNumber() {
            const price = await fetchBitcoinPrice();
            if (price !== null && numProp) {
              numProp.value = price;
              console.log("Updated Rive num:", price);
            }
          }

          // Initial update + interval
          updateNumber();
          setInterval(updateNumber, 10000);
        },
        onLoadError: (err) => {
          console.error("Failed to load Rive file:", err);
        }
      });
    }
  </script>
</body>
</html>
