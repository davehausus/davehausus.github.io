<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>v1 Data Binding</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #riveCanvas {
      width: 400px;
      height: 400px;
    }
    .status {
      margin-top: 10px;
      color: #8b949e;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <canvas id="riveCanvas" width="428" height="926"></canvas>
  <div class="status" id="statusText">Loading Bitcoin price…</div>

  <script type="module">
    import Rive from "https://unpkg.com/@rive-app/webgl2";

    const riveFileUrl = "data_bind.riv"; // 👈 Replace with your actual .riv file
    const status = document.getElementById("statusText");

    const riveInstance = new Rive({
      src: riveFileUrl,
      canvas: document.getElementById("riveCanvas"),
      autoplay: true,
      onLoad: (_) => {
        console.log("✅ Rive animation loaded");
        updateNumber();
        setInterval(updateNumber, 10000); // Update every 10 seconds
      },
    });

    // Fetch live Bitcoin price (CORS-friendly)
    async function fetchBitcoinPrice() {
      const response = await fetch("https://api.coindesk.com/v1/bpi/currentprice.json");
      const data = await response.json();
      return data.bpi.USD.rate_float;
    }

    async function updateNumber() {
      try {
        const value = await fetchBitcoinPrice();

        // Access the ViewModel directly
        const viewModel = riveInstance.viewModel("View Model 1");
        if (viewModel && viewModel.has("num")) {
          viewModel.setNumber("num", value);
          console.log("💹 Updated ViewModel → num:", value);
          status.textContent = `Bitcoin: $${value.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
        } else {
          console.warn("ViewModel or 'num' property not found.");
          status.textContent = "⚠️ ViewModel 'num' not found";
        }
      } catch (err) {
        console.error("Error fetching price:", err);
        status.textContent = "⚠️ Failed to fetch data";
      }
    }
  </script>

</body>
</html>
