<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v1.15 Rive Data Binding (UMD)</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f0f0;
    }
    canvas {
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <!-- Correct UMD Rive Script -->
  <script src="https://unpkg.com/@rive-app/canvas@2.21.4/rive.umd.min.js"></script>

  <script>
    if (typeof Rive === 'undefined') {
      console.error('Rive UMD script not loaded!');
    } else {
      console.log('Rive UMD loaded!');

      // Instantiate Rive
      const riveInstance = new Rive({
        src: 'https://davehausus.github.io/rive/data_binding.riv', // GitHub-hosted file
        canvas: document.getElementById('riveCanvas'),
        autoplay: true,
        crossorigin: 'anonymous',
        onLoad: () => {
          console.log('Rive animation loaded!');

          // Get state machine inputs
          const inputs = riveInstance.stateMachineInputs('View Model 1');
          const numProp = inputs.find(i => i.name === 'num');

          // Fetch Bitcoin price from a CORS-friendly API
          async function fetchBitcoinPrice() {
            try {
              const response = await fetch('https://api.coindesk.com/v1/bpi/currentprice/USD.json');
              const data = await response.json();
              return parseFloat(data.bpi.USD.rate.replace(',', ''));
            } catch (err) {
              console.error('Fetch error:', err);
              return null;
            }
          }

          // Update the Rive input
          async function updateNumber() {
            const price = await fetchBitcoinPrice();
            if (price !== null && numProp) {
              numProp.value = price;
              console.log('Updated Rive num:', price);
            }
          }

          // Initial update
          updateNumber();
          // Update every 10 seconds
          setInterval(updateNumber, 10000);
        },
        onLoadError: (err) => {
          console.error('Failed to load Rive file:', err);
        }
      });
    }
  </script>
</body>
</html>
