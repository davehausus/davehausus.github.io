  <!-- SOCIAL MEDIA META -->
  <meta property="og:description" content="A real-time crypto data visualization built with Rive, featuring animated charts, live Bitcoin price updates, and smooth transitions driven by external APIs and ViewModel data binding.">
  <meta property="og:image" content="https://daviddejesus.me/images/adl-rive.png">

  <meta property="og:title" content="Live Bitcoin Data Visualization with Rive Data Binding">

  <meta property="og:url" content="https://daviddejesus.me/rive/data_bind.html">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background: #0B0A14;
    }

    canvas {
      border-radius: 16px;
      opacity: 0; /* Start hidden */
      transition: opacity 0.5s ease-in-out; /* Smooth fade-in */
      width: 100%;
      max-width: 500px;
      height: auto;
      display: block;
    }

    canvas.loaded {
      opacity: 1; /* Show when loaded */
    }

    /* Optional: Loading spinner */
    .loading {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading.hidden {
      display: none;
    }
  </style>

<script src="https://unpkg.com/@rive-app/webgl2"></script>

</head>

<body>
  <div class="loading" id="loadingIndicator">
    <div class="spinner"></div>
    <span>Loading Bitcoin data...</span>
  </div>
  <canvas id="riveCanvas" width="375" height="667"></canvas>

  <script>
    const canvas = document.getElementById("riveCanvas");

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;

      // Fixed visual size (CSS size)
      const cssWidth = 375;
      const cssHeight = 667;

      // Keep same visible size on screen
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;

      // Higher internal resolution for Retina / high-DPI screens
      canvas.width = cssWidth * dpr;
      canvas.height = cssHeight * dpr;
    }

    resizeCanvas();

    const r = new rive.Rive({
      src: "data_binding.riv",
      canvas: canvas,
      autoplay: false,
      autoBind: true,
      artboard: "Artboard",
      stateMachines: "State Machine 1",

      layout: new rive.Layout({
        fit: rive.Fit.contain,
        alignment: rive.Alignment.center,
      }),

      assetLoader: async (asset, bytes) => {
        console.log("🔍 Asset detected:", asset.name, "Type:", asset.isFont ? "Font" : "Other");

        if (bytes.length > 0 || asset.cdnUuid.length > 0) {
          console.log("  ↳ Letting Rive handle this asset");
          return false;
        }

        if (asset.isFont) {
          console.log("  ↳ Loading referenced font:", asset.name);
          try {
            const fontResponse = await fetch(`../fonts/Kode_Mono/KodeMono-VariableFont_wght.ttf`);
            const fontData = await fontResponse.arrayBuffer();
            const font = await rive.decodeFont(new Uint8Array(fontData));
            asset.setFont(font);
            console.log("  ✅ Font loaded successfully!");
            return true;
          } catch (error) {
            console.error("  ❌ Error loading font:", error);
            return false;
          }
        }

        return false;
      },

      onLoad: async () => {
        console.log("✅ Rive file loaded successfully!");
        // Important for WebGL2 renderer:
        // tell Rive to resize after canvas dimensions are set
        r.resizeDrawingSurfaceToCanvas();
        await new Promise(rslv => setTimeout(rslv, 300));

        const vmi = r.viewModelInstance;
        if (!vmi) {
          console.error("❌ No ViewModelInstance found!");
          return;
        }

        // ─── View Model Properties ────────────────────────────────────────────
        const newPriceProp  = vmi.number("newPrice");
        const oldPriceProp  = vmi.number("oldPrice");
        const priceDiffProp = vmi.number("priceDiff");  // Always positive (abs)
        const percDiffProp  = vmi.number("percDiff");   // Signed — negative shows "-"
        const showDiffProp  = vmi.boolean("showDiff");
        const btcEthProp    = vmi.boolean("btcEth");    // true = BTC | false = ETH
        const maxRangeProp  = vmi.number("maxRange");
        const minRangeProp  = vmi.number("minRange");

        // bar1 (bars[0]) = newest  ·  bar30 (bars[29]) = oldest
        const bars = Array.from({ length: 30 }, (_, i) => vmi.number(`bar${i + 1}`));

        // Time-range booleans (replace triggers)
        const rangeBoolProps = {
          h1:  vmi.boolean("h1"),
          h24: vmi.boolean("h24"),
          d7:  vmi.boolean("d7"),
          d30: vmi.boolean("d30"),
          d90: vmi.boolean("d90"),
        };

        // ─── Runtime State ────────────────────────────────────────────────────
        let isBitcoin     = true;   // Initial coin: BTC
        let currentRange  = "h1";   // Initial range: 1H
        let previousPrice = null;   // Last recorded spot price
        let bar30Target   = null;   // Target value for bar30 (oldest candle in range)

        // Stable snapshots for change-detection (fast-poll loop)
        let lastBtcEth     = true;
        let lastRangeBools = { h1: true, h24: false, d7: false, d30: false, d90: false };

        // Per-bar animation targets (avoids reading .value mid-animation)
        const barTargets = new Array(30).fill(0);

        // ─── Bootstrap: push initial boolean states into Rive ─────────────────
        if (btcEthProp) btcEthProp.value = true;
        Object.entries(rangeBoolProps).forEach(([key, prop]) => {
          if (prop) prop.value = key === "h1";
        });

        // ─── Time-Range Configuration ─────────────────────────────────────────
        //  Granularity is chosen as the finest valid Coinbase value that keeps
        //  the candle count ≤ 300, then we resample down to exactly 30 bars.
        //
        //  h1  →  3 600 s ÷    60 s =  60 candles → resample → 30
        //  h24 → 86 400 s ÷   900 s =  96 candles → resample → 30
        //  d7  → 604 800 s ÷ 3 600 s = 168 candles → resample → 30
        //  d30 → 2 592 000 s ÷ 86 400 s = 30 candles → exact 30
        //  d90 → 7 776 000 s ÷ 86 400 s = 90 candles → resample → 30
        const RANGES = {
          h1:  { label: "1H",  durationSec: 3_600,     granularity: 60      },
          h24: { label: "1D",  durationSec: 86_400,    granularity: 900     },
          d7:  { label: "1W",  durationSec: 604_800,   granularity: 3_600   },
          d30: { label: "1M",  durationSec: 2_592_000, granularity: 86_400  },
          d90: { label: "3M",  durationSec: 7_776_000, granularity: 86_400  },
        };

        // ─── Haptics ──────────────────────────────────────────────────────────
        const isIOS        = /iPhone|iPad|iPod/.test(navigator.userAgent);
        const isStandalone = window.navigator.standalone ||
                            window.matchMedia('(display-mode: standalone)').matches;

        if (isIOS && !isStandalone)
          console.log("ℹ️ iOS Safari: add to Home Screen to enable haptics.");

        ['touchstart', 'click'].forEach(evt => {
          document.addEventListener(evt, () => {
            if (!window._audioCtx && isIOS)
              window._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }, { once: true });
        });

        function triggerHaptic() {
          try { if ('vibrate' in navigator) navigator.vibrate(50); } catch (_) {}
        }

        // ─── Ease-Out Bar Animation (200ms) ───────────────────────────────────
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        function animateBarTo(index, target, duration = 200) {
          const bar = bars[index];
          if (!bar) return;

          const start       = barTargets[index];
          barTargets[index] = target;

          const t0 = performance.now();
          (function step(now) {
            const p  = Math.min((now - t0) / duration, 1);
            bar.value = start + (target - start) * easeOutCubic(p);
            if (p < 1) requestAnimationFrame(step);
          })(t0);
        }

        // Snap all bars to a baseline value with no animation,
        // then immediately kick off the normal ease-out from that baseline.
        function snapAndAnimateBars(closes, baseline) {
          closes.forEach((price, i) => {
            const index       = 29 - i;
            barTargets[index] = baseline; // start point for the upcoming ease-out
            if (bars[index]) bars[index].value = baseline;
          });
          // Now animate to actual targets — easeOut starts from `baseline`
          closes.forEach((price, i) => animateBarTo(29 - i, price, 200));
        }

        // ─── Helpers ─────────────────────────────────────────────────────────
        const getProductId = () => isBitcoin ? "BTC-USD" : "ETH-USD";

        function resampleTo(arr, n) {
          if (arr.length === 0) return Array(n).fill(0);
          if (arr.length === n) return [...arr];
          return Array.from({ length: n }, (_, i) => {
            const idx = Math.round(i * (arr.length - 1) / (n - 1));
            return arr[Math.min(idx, arr.length - 1)];
          });
        }

        // ─── Diff Calculations (called alongside newPrice updates) ───────────
        // priceDiff: |newPrice − bar30|  → always positive, never shows "-"
        // percDiff:  signed %            → shows "-" when price dropped
        function updateDiffs(price) {
          if (bar30Target === null) return;
          const diff = price - bar30Target;
          priceDiffProp.value = Math.abs(diff);
          percDiffProp.value  = bar30Target !== 0
            ? (diff / bar30Target) * 100
            : 0;
        }

        // ─── Chart Data Fetch ─────────────────────────────────────────────────
        async function fetchChartData(range) {
          const cfg   = RANGES[range];
          const end   = new Date();
          const start = new Date(end.getTime() - cfg.durationSec * 1000);

          const url =
            `https://api.exchange.coinbase.com/products/${getProductId()}/candles` +
            `?start=${start.toISOString()}&end=${end.toISOString()}&granularity=${cfg.granularity}`;

          console.log(`📊 [${cfg.label}] ${getProductId()} — granularity: ${cfg.granularity}s`);

          const res  = await fetch(url);
          const data = await res.json();

          if (!Array.isArray(data) || data.length === 0) {
            console.error("❌ Empty candle response");
            return null;
          }

          // Sort ascending (oldest → newest), extract close prices
          const closes  = [...data].sort((a, b) => a[0] - b[0]).map(c => c[4]);
          const sampled = resampleTo(closes, 30); // sampled[0]=oldest, sampled[29]=newest

          return {
            closes:  sampled,
            oldest:  sampled[0],
            newest:  sampled[29],
            min:     Math.min(...sampled),
            max:     Math.max(...sampled),
          };
        }

        // ─── Update Chart ─────────────────────────────────────────────────────
        async function updateChart(range, snapFirst = false) {
          try {
            const cd = await fetchChartData(range);
            if (!cd) return;

            const { closes, oldest, newest, min, max } = cd;

            // Update scale properties BEFORE touching bars so Rive's coordinate
            // system is correct for whichever values we're about to write.
            maxRangeProp.value = max;
            minRangeProp.value = min;

            if (snapFirst) {
              // Snap every bar to min so they're always inside the new scale,
              // then ease-out upward to the real values.
              snapAndAnimateBars(closes, min);
            } else {
              closes.forEach((price, i) => animateBarTo(29 - i, price, 200));
            }

            bar30Target = oldest;
            if (previousPrice !== null) updateDiffs(previousPrice);

            console.log(
              `✅ [${range}] ${getProductId()} →`,
              `oldest=$${oldest.toFixed(2)}, newest=$${newest.toFixed(2)},`,
              `min=$${min.toFixed(2)}, max=$${max.toFixed(2)}`
            );
          } catch (err) {
            console.error("⚠️ Chart update error:", err);
          }
        }

        // ─── Spot Price Update ────────────────────────────────────────────────
        async function updateSpotPrice() {
          try {
            const res   = await fetch(`https://api.coinbase.com/v2/prices/${getProductId()}/spot`);
            const json  = await res.json();
            const price = parseFloat(json.data.amount);

            if (previousPrice !== null) {
              oldPriceProp.value = previousPrice;
              const changed = Math.abs(price - previousPrice) > 0.001;
              showDiffProp.value = changed;
              if (changed) {
                console.log(`  ↳ $${previousPrice.toFixed(2)} → $${price.toFixed(2)}`);
                triggerHaptic();
              }
            } else {
              oldPriceProp.value = price;
              showDiffProp.value = false;
            }

            newPriceProp.value = price;
            previousPrice      = price;

            // priceDiff & percDiff update in lockstep with newPrice
            updateDiffs(price);

            console.log(`💰 ${getProductId()} $${price.toFixed(2)}`);
          } catch (err) {
            console.error("⚠️ Spot price error:", err);
          }
        }

        // ─── Coin + Range Boolean Polling (100ms for instant response) ────────
        function pollBooleans() {
          // ── btcEth ──────────────────────────────────────────────────────────
          if (btcEthProp) {
            const cur = btcEthProp.value;
            if (cur !== lastBtcEth) {
              lastBtcEth    = cur;
              isBitcoin     = cur;
              previousPrice = null;
              bar30Target   = null;
              console.log(`🪙 Coin → ${isBitcoin ? "BTC" : "ETH"}`);
              // Fetch both chart and spot instantly
              updateChart(currentRange, true);
              updateSpotPrice();
            }
          }

          // ── Time-range booleans ──────────────────────────────────────────────
          // Detect whichever range was just switched ON
          for (const key of Object.keys(rangeBoolProps)) {
            const prop = rangeBoolProps[key];
            if (!prop) continue;
            const cur = prop.value;

            // Rising edge: false → true
            if (cur && !lastRangeBools[key]) {
              // Update snapshot (turn all off, then this one on)
              Object.keys(lastRangeBools).forEach(k => { lastRangeBools[k] = false; });
              lastRangeBools[key] = true;

              currentRange = key;
              bar30Target  = null;
              console.log(`⏱️ Range → [${key}]`);
              updateChart(key);
              break; // Only handle one rising edge per tick
            } else {
              lastRangeBools[key] = cur;
            }
          }
        }

        // ─── Chart Auto-Refresh (aligned to active range granularity) ─────────
        let chartRefreshTimer = null;

        function scheduleChartRefresh() {
          clearTimeout(chartRefreshTimer);
          const ms = RANGES[currentRange].granularity * 1000;
          chartRefreshTimer = setTimeout(async () => {
            console.log(`🔄 Auto-refresh [${currentRange}]`);
            await updateChart(currentRange);
            scheduleChartRefresh();
          }, ms);
        }

        // ─── External API ─────────────────────────────────────────────────────
        window.setTimeRange = (range) => {
          if (!RANGES[range]) { console.warn(`Unknown range "${range}"`); return; }
          // Reflect into Rive booleans
          Object.entries(rangeBoolProps).forEach(([k, p]) => { if (p) p.value = k === range; });
          // pollBooleans() will pick this up on next tick and fetch — or call directly:
          Object.keys(lastRangeBools).forEach(k => { lastRangeBools[k] = false; });
          lastRangeBools[range] = false; // force rising-edge detection on next poll
        };

        window.setCoin = (btc) => {
          if (btcEthProp) btcEthProp.value = btc;
          lastBtcEth = !btc; // force rising-edge detection on next poll
        };

        // ─── Bootstrap ────────────────────────────────────────────────────────
        console.log(`🪙 Initial coin:  BTC`);
        console.log(`⏱️ Initial range: [h1]`);

        await updateChart(currentRange);
        await updateSpotPrice();
        await new Promise(resolve => setTimeout(resolve, 500));

        document.getElementById("riveCanvas").classList.add("loaded");
        document.getElementById("loadingIndicator").classList.add("hidden");
        r.play();

        console.log("✅ Bootstrap complete — animation started.");

        // Fast boolean poll — instant response to any toggle
        setInterval(pollBooleans, 100);

        // Spot price update every 2s
        setInterval(updateSpotPrice, 2000);

        // Chart auto-refresh aligned to range granularity
        scheduleChartRefresh();
      },
    });
    // Re-apply on resize / device rotation
    window.addEventListener("resize", () => {
      resizeCanvas();
      r.resizeDrawingSurfaceToCanvas();
    });
  </script>
</body>
</html>
