<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>v1.2 Bitcoin Live Data Bind</title>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      height: 100vh;
    }
    canvas {
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    const riveCanvas = document.getElementById("riveCanvas");

    const riveInstance = new rive.Rive({
      src: "data_bind.riv",
      canvas: riveCanvas,
      autoplay: true,
      onLoad: async () => {
        console.log("✅ Rive file loaded successfully!");

        // ✅ Correct API call
        const viewModel = riveInstance.dataBindings.viewModel("View Model 1");
        if (!viewModel) {
          console.error("❌ View Model 'View Model 1' not found!");
          return;
        }

        // ✅ Correct way to access the number input
        const numProperty = viewModel.input("num");
        if (!numProperty) {
          console.error("❌ Property 'num' not found in View Model 1!");
          return;
        }

        console.log("🔗 Bound to property 'num' successfully!");

        async function updateBitcoinPrice() {
          try {
            const response = await fetch("https://api.coindesk.com/v1/bpi/currentprice/USD.json");
            const data = await response.json();
            const price = data.bpi.USD.rate_float;

            console.log("💰 BTC Price:", price);
            numProperty.value = price; // Update the number input in Rive
          } catch (error) {
            console.error("⚠️ Error fetching Bitcoin data:", error);
          }
        }

        // Initial fetch
        await updateBitcoinPrice();
        // Refresh every 10 seconds
        setInterval(updateBitcoinPrice, 10000);
      }
    });
  </script>
</body>
</html>
