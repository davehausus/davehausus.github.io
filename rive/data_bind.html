<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Live Data Bind</title>
  <style>
    @font-face {
      font-family: "Roboto Condensed";
      src: url("./RobotoCondensed-Italic-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: italic;
    }
    
    @font-face {
      font-family: "RobotoCondensed";
      src: url("./RobotoCondensed-Italic-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: italic;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background: #011029;
    }

    canvas {
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 64, 255, 0.3);
    }
  </style>

  <script src="https://unpkg.com/@rive-app/webgl2"></script>
</head>

<body>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    // Wait for fonts to load BEFORE initializing Rive
    async function initRive() {
      // Force font loading
      await document.fonts.load('400 1em "Roboto Condensed"');
      await document.fonts.load('800 1em "Roboto Condensed"');
      await document.fonts.load('400 1em "RobotoCondensed"');
      await document.fonts.load('800 1em "RobotoCondensed"');
      
      await document.fonts.ready;
      
      console.log("🔤 Fonts loaded and ready:");
      document.fonts.forEach(font => {
        console.log(`  - ${font.family} (weight: ${font.weight}, style: ${font.style})`);
      });

      // NOW create the Rive instance
      const r = new rive.Rive({
        src: "data_bind.riv",
        canvas: document.getElementById("riveCanvas"),
        autoplay: true,
        autoBind: true,
        artboard: "Artboard",
        stateMachines: "State Machine 1",

        onLoad: async () => {
          console.log("✅ Rive file loaded successfully!");

          await new Promise((rslv) => setTimeout(rslv, 300));

          const vmi = r.viewModelInstance;
          if (!vmi) {
            console.error("❌ No ViewModelInstance found!");
            return;
          }

          const numProp = vmi.number("num");
          if (!numProp) {
            console.error("❌ Number property 'num' not found!");
            return;
          }

          console.log("🔗 Bound to property 'num' successfully!");

          async function updateBitcoinPrice() {
            try {
              const response = await fetch("https://api.coinbase.com/v2/prices/spot?currency=USD");
              const data = await response.json();
              const price = parseFloat(data.data.amount);

              console.log("💰 BTC Price:", price);
              numProp.value = price;
            } catch (error) {
              console.error("⚠️ Error fetching Bitcoin data:", error);
            }
          }

          await updateBitcoinPrice();
          setInterval(updateBitcoinPrice, 2000);
        },
      });
    }

    // Initialize when page is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initRive);
    } else {
      initRive();
    }
  </script>
</body>
</html>
