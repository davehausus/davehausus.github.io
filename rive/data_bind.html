<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Live Data Bind</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background: #010a1b;
    }

    canvas {
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(1, 28, 111, 0.3);
      opacity: 0; /* Start hidden */
      transition: opacity 0.5s ease-in-out; /* Smooth fade-in */
    }

    canvas.loaded {
      opacity: 1; /* Show when loaded */
    }

    /* Optional: Loading spinner */
    .loading {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading.hidden {
      display: none;
    }
  </style>

  <script src="https://unpkg.com/@rive-app/webgl2"></script>
</head>

<body>
  <div class="loading" id="loadingIndicator">
    <div class="spinner"></div>
    <span>Loading Bitcoin data...</span>
  </div>
  <canvas id="riveCanvas" width="428" height="926"></canvas>

  <script>
    const r = new rive.Rive({
      src: "data_binding.riv",
      canvas: document.getElementById("riveCanvas"),
      autoplay: false, // Don't autoplay until data is loaded
      autoBind: true,
      artboard: "Artboard",
      stateMachines: "State Machine 1",
      
      // CRITICAL: Asset loader to handle referenced fonts
      assetLoader: async (asset, bytes) => {
        console.log("🔍 Asset detected:", asset.name, "Type:", asset.isFont ? "Font" : "Other");
        
        if (bytes.length > 0 || asset.cdnUuid.length > 0) {
          console.log("  ↳ Letting Rive handle this asset");
          return false;
        }
        
        if (asset.isFont) {
          console.log("  ↳ Loading referenced font:", asset.name);
          
          try {
            const fontResponse = await fetch(`./RobotoCondensed-Italic-VariableFont_wght-5011138.ttf`);
            const fontData = await fontResponse.arrayBuffer();
            
            const font = await rive.decodeFont(new Uint8Array(fontData));
            asset.setFont(font);
            
            console.log("  ✅ Font loaded successfully!");
            return true;
          } catch (error) {
            console.error("  ❌ Error loading font:", error);
            return false;
          }
        }
        
        return false;
      },

      onLoad: async () => {
        console.log("✅ Rive file loaded successfully!");

        await new Promise((rslv) => setTimeout(rslv, 300));

        const vmi = r.viewModelInstance;
        if (!vmi) {
          console.error("❌ No ViewModelInstance found!");
          return;
        }

        const numProp = vmi.number("num");
        const diffProp = vmi.string("priceDiff");
        const showDiffProp = vmi.boolean("showDiff");
        
        const bars = [
          vmi.number("bar1"), vmi.number("bar2"), vmi.number("bar3"),
          vmi.number("bar4"), vmi.number("bar5"), vmi.number("bar6"),
          vmi.number("bar7"), vmi.number("bar8"), vmi.number("bar9"),
          vmi.number("bar10"), vmi.number("bar11"), vmi.number("bar12")
        ];
        
        if (!numProp) {
          console.error("❌ Number property 'num' not found!");
          return;
        }
        
        if (!diffProp || !showDiffProp) {
          console.error("❌ String property 'priceDiff' or 'showDiff' not found!");
          return;
        }

        const missingBars = bars.filter((bar, index) => !bar);
        if (missingBars.length > 0) {
          console.error("❌ Some bar properties not found!");
          return;
        }

        console.log("🔗 Bound to all properties successfully!");

        let previousPrice = null;

        async function fetchHourlyData() {
          try {
            console.log("📊 Fetching last 12 hours of Bitcoin data...");
            
            const end = new Date();
            const start = new Date();
            start.setHours(start.getHours() - 12);
            
            const startISO = start.toISOString();
            const endISO = end.toISOString();
            
            const url = `https://api.exchange.coinbase.com/products/BTC-USD/candles?start=${startISO}&end=${endISO}&granularity=3600`;
            
            const response = await fetch(url);
            const data = await response.json();
            
            const hourlyPrices = data.map(candle => ({
              timestamp: new Date(candle[0] * 1000),
              close: candle[4]
            })).reverse();
            
            console.log(`📊 Fetched ${hourlyPrices.length} hours of data`);
            
            bars.forEach((bar, index) => {
              if (bar && hourlyPrices[index]) {
                const newValue = hourlyPrices[index].close;
                bar.value = newValue + 0.01;
                
                setTimeout(() => {
                  bar.value = newValue;
                  console.log(`  Bar ${index + 1}: $${newValue.toFixed(2)} at ${hourlyPrices[index].timestamp.toLocaleTimeString()}`);
                }, 10);
              }
            });
            
            console.log("✅ Chart updated successfully at", new Date().toLocaleTimeString());
            
          } catch (error) {
            console.error("⚠️ Error fetching hourly data:", error);
          }
        }

        async function updateBitcoinPrice() {
          try {
            const response = await fetch("https://api.coinbase.com/v2/prices/spot?currency=USD");
            const data = await response.json();
            const price = parseFloat(data.data.amount);

            console.log("💰 BTC Price:", price);
            
            if (previousPrice !== null) {
              const diff = price - previousPrice;
              const diffFormatted = diff >= 0 
                ? `+$${diff.toFixed(2)}` 
                : `-$${Math.abs(diff).toFixed(2)}`;
              
              console.log("📊 Price Change:", diffFormatted);
              diffProp.value = diffFormatted;
              
              if (diffFormatted === "+$0.00") {
                showDiffProp.value = false;
              } else {
                showDiffProp.value = true;
              }
            } else {
              diffProp.value = "";
              showDiffProp.value = false;
            }
            
            numProp.value = price;
            previousPrice = price;
            
          } catch (error) {
            console.error("⚠️ Error fetching Bitcoin data:", error);
          }
        }

        function msUntilNextHour() {
          const now = new Date();
          const nextHour = new Date(now);
          nextHour.setHours(now.getHours() + 1, 0, 0, 0);
          return nextHour - now;
        }

        // IMPORTANT: Load all data first
        console.log("⏳ Loading initial data...");
        await fetchHourlyData();
        await updateBitcoinPrice();
        
        // Wait a moment for Rive to process the values
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Now show the canvas and start animation
        const canvas = document.getElementById("riveCanvas");
        const loadingIndicator = document.getElementById("loadingIndicator");
        
        canvas.classList.add("loaded");
        loadingIndicator.classList.add("hidden");
        r.play(); // Start the animation
        
        console.log("✅ All data loaded! Animation started.");

        // Update current price every 2 seconds
        setInterval(updateBitcoinPrice, 2000);

        // Schedule hourly updates
        const msToNextHour = msUntilNextHour();
        console.log(`⏰ Next chart update in ${Math.round(msToNextHour / 1000 / 60)} minutes at ${new Date(Date.now() + msToNextHour).toLocaleTimeString()}`);
        
        setTimeout(() => {
          console.log("🔄 Starting hourly chart updates...");
          fetchHourlyData();
          
          setInterval(() => {
            console.log("🔄 Hourly update triggered");
            fetchHourlyData();
          }, 3600000);
        }, msToNextHour);
      },
    });
  </script>
</body>
</html>
