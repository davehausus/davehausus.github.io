<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSS FILES -->
  <link rel="stylesheet" href="../../css/animate.min.css">
  <link rel="stylesheet" href="../../css/swiper.min.css">
  <link rel="stylesheet" href="../../css/bootstrap.min.css">
  <link rel="stylesheet" href="../../css/style.css">
  <title>Blue Orchid Twinkle Poke</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background-color: #212E44;
    }
  </style>
</head>

<body>
  <canvas id="riveCanvas" width="380" height="380"></canvas>

  <script src="https://unpkg.com/@rive-app/canvas-advanced@2.23.6/rive.js"></script>
  <script>
    console.log('Loading Rive...');
    console.log('Global rive:', window.rive);
    
    // Use the global rive variable exposed by the UMD build
    window.rive({
      locateFile: (file) => {
        console.log('Looking for file:', file);
        return `https://unpkg.com/@rive-app/canvas-advanced@2.23.6/${file}`;
      }
    }).then((module) => {
      console.log('✅ Rive module loaded with scripting support');
      console.log('Module:', module);
      
      // Create the Rive instance - scripts embedded in the .riv file will be executed automatically
      const riveInstance = new module.Rive({
        src: "twinkle-script.riv",
        canvas: document.getElementById("riveCanvas"),
        autoplay: true,
        artboard: "Artboard",
        stateMachines: ["State Machine 1"],
        onLoad: () => {
          console.log("✅ Rive file loaded: Artboard + State Machine 1");
          console.log("🎨 Embedded script should now be running!");
        },
        onLoadError: (err) => {
          console.error("❌ Error loading Rive file:", err);
        }
      });
    }).catch((err) => {
      console.error("❌ Failed to load Rive module:", err);
    });
  </script>

  <p>
    <button type="button" onclick="location.href='/rive/pokes/'">
      <strong>Back</strong>
    </button>
  </p>
</body>
</html>
