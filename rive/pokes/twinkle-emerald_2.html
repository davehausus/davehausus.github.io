<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- CSS FILES -->
<link rel="stylesheet" href="../../css/animate.min.css">
<link rel="stylesheet" href="../../css/swiper.min.css">
<link rel="stylesheet" href="../../css/bootstrap.min.css">
<link rel="stylesheet" href="../../css/style.css">
  <title>Emerald Twinkle Poke</title>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background-color: #212E44;
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="380" height="380"></canvas>

  <script>
    let riveInstance;

    // Load the "Artboard" artboard and "State Machine 1"
    riveInstance = new rive.Rive({
      src: "twinkle-emerald_2.riv", // Replace with your .riv file path
      canvas: document.getElementById("riveCanvas"),
      autoplay: true,
      artboard: "Artboard", // Explicitly set the artboard
      stateMachines: ["State Machine 1"], // The single state machine
      onLoad: () => {
        console.log("Rive file loaded: Artboard + State Machine 1");
      }
    });

    // Randomize exits by triggering the "exit" input in State Machine 1
    function randomizeExit() {
      if (!riveInstance) return;

      const inputs = riveInstance.stateMachineInputs("State Machine 1");
      const exitInput = inputs.find(input =>
        input.name.toLowerCase().includes("exit")
      );

      if (exitInput) {
        if (exitInput.type === "trigger") {
          exitInput.fire();
          console.log("Exit trigger fired");
        } else if (exitInput.type === "boolean") {
          exitInput.value = !exitInput.value;
          console.log("Exit boolean toggled");
        }
      }
    }

    // Call randomizeExit every 3 seconds
    setInterval(randomizeExit, 3000);
  </script>
<p>
<button type="contact" onclick="location.href='/rive/pokes/'">
              <strong>Back</strong>
</button>
</p>
</body>
</html>
