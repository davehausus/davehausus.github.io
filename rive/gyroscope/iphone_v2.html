<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rive Gyroscope</title>
  <script src="https://unpkg.com/@rive-app/webgl2@latest"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a1a;
    }

    canvas {
      max-width: 500px;
      max-height: 500px;
    }

    #permissionBtn {
      position: absolute;
      padding: 16px 32px;
      font-size: 18px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
      display: none;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="500" height="500"></canvas>
  <button id="permissionBtn">Enable Gyroscope</button>
  <div id="status">Loading...</div>
  
  <script>
    const riveFile = "tag_gyro.riv";
    const timelineName = "rotation_timeline";
    const stateMachineName = "State Machine 1";
    const canvas = document.getElementById("riveCanvas");
    const button = document.getElementById("permissionBtn");
    const statusDiv = document.getElementById("status");

    function updateStatus(msg) {
      console.log(msg);
      statusDiv.textContent = msg;
    }

    // --- Professional Gyroscope Processing ---
    class GyroProcessor {
      constructor() {
        this.smoothingFactor = 0.35;
        this.currentValue = 0;
        this.targetValue = 0;
        
        this.calibrationSamples = [];
        this.maxCalibrationSamples = 30;
        this.isCalibrated = false;
        this.baselineOffset = 0;
        
        this.noiseThreshold = 0.2;
        this.previousRaw = 0;
        
        this.inputMin = -45;
        this.inputMax = 45;
        this.deadZone = 0.5;
        
        this.animationFrameId = null;
        this.startSmoothingLoop();
      }

      smooth(current, target, factor) {
        return current + (target - current) * factor;
      }

      calibrate(rawValue) {
        if (this.isCalibrated) return;
        
        this.calibrationSamples.push(rawValue);
        
        if (this.calibrationSamples.length >= this.maxCalibrationSamples) {
          const sum = this.calibrationSamples.reduce((a, b) => a + b, 0);
          this.baselineOffset = sum / this.calibrationSamples.length;
          this.isCalibrated = true;
          updateStatus(`Calibrated! Baseline: ${this.baselineOffset.toFixed(2)}°`);
        }
      }

      processInput(rawGamma) {
        if (rawGamma === null) return this.currentValue;
        
        if (!this.isCalibrated) {
          this.calibrate(rawGamma);
          return 0;
        }
        
        let adjusted = rawGamma - this.baselineOffset;
        
        const delta = Math.abs(adjusted - this.previousRaw);
        if (delta < this.noiseThreshold) {
          adjusted = this.previousRaw;
        }
        this.previousRaw = adjusted;
        
        if (Math.abs(adjusted) < this.deadZone) {
          adjusted = 0;
        }
        
        adjusted = Math.max(this.inputMin, Math.min(this.inputMax, adjusted));
        
        const normalized = adjusted / 45.0;
        
        this.targetValue = normalized;
        
        return this.currentValue;
      }

      startSmoothingLoop() {
        const animate = () => {
          this.currentValue = this.smooth(
            this.currentValue,
            this.targetValue,
            this.smoothingFactor
          );
          
          this.animationFrameId = requestAnimationFrame(animate);
        };
        animate();
      }

      getValue() {
        return this.currentValue;
      }

      destroy() {
        if (this.animationFrameId) {
          cancelAnimationFrame(this.animationFrameId);
        }
      }
    }

    const gyroProcessor = new GyroProcessor();

    // --- Initialize Rive ---
    const riveInstance = new rive.Rive({
      src: riveFile,
      canvas: canvas,
      autoplay: true,
      autoBind: true,
      stateMachines: stateMachineName,
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center,
      useOffscreenRenderer: true,
      onLoad: () => {
        updateStatus('✅ Rive loaded');
        
        riveInstance.resizeDrawingSurfaceToCanvas();
        
        // Get View Model Instance
        const vmi = riveInstance.viewModelInstance;
        if (!vmi) {
          console.error("❌ No ViewModelInstance found!");
          return;
        }
        
        console.log("✅ View Model Instance connected");
        
        // Define View Model properties
        const clickTrigger = vmi.trigger("click");
        
        console.log("✅ View Model properties defined:", {
          click: clickTrigger
        });
        
        startRiveUpdateLoop(vmi);
      },
    });

    // --- Continuous update loop for Rive ---
    function startRiveUpdateLoop(vmi) {
      const totalFrames = 60;
      const centerFrame = 30;
      
      // Create a number property to control the timeline
      const gyroYProp = vmi.number("gyroY");
      
      if (!gyroYProp) {
        console.error("❌ gyroY property not found in ViewModel!");
        return;
      }
      
      let frameCount = 0;
      
      function update() {
        const gyroY = gyroProcessor.getValue();
        
        // Map gyroY (-1.0 to +1.0) to frame range (0 to 60)
        const targetFrame = centerFrame + (gyroY * centerFrame);
        const clampedFrame = Math.max(0, Math.min(totalFrames, targetFrame));
        
        // Update the ViewModel property
        gyroYProp.value = clampedFrame;
        
        // Debug logging every 60 frames
        if (frameCount % 60 === 0) {
          updateStatus(`gyroY: ${gyroY.toFixed(3)} | Frame: ${clampedFrame.toFixed(1)}`);
        }
        frameCount++;
        
        requestAnimationFrame(update);
      }
      update();
    }

    // --- Handle motion permission (iOS) ---
    function setupMotion() {
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        button.style.display = "block";
        button.onclick = () => {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === "granted") {
                button.style.display = "none";
                window.addEventListener("deviceorientation", handleOrientation);
                updateStatus('Gyroscope enabled! Calibrating...');
              } else {
                updateStatus('Motion access denied');
              }
            })
            .catch(err => {
              updateStatus('Error: ' + err.message);
            });
        };
      } else {
        window.addEventListener("deviceorientation", handleOrientation);
        updateStatus('Gyroscope enabled! Calibrating...');
      }
    }

    function handleOrientation(event) {
      const { gamma } = event;
      gyroProcessor.processInput(gamma);
    }

    setupMotion();

    window.addEventListener("beforeunload", () => {
      gyroProcessor.destroy();
    });
  </script>
</body>
</html>
