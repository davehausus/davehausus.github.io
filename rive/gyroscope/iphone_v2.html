<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rive Gyroscope (500x500)</title>
  <script src="https://unpkg.com/@rive-app/webgl2@latest"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Fixed-size Rive canvas */
    canvas {
      width: 500px;
      height: 500px;
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
    }

    #permissionBtn {
      position: absolute;
      bottom: 2rem;
      background: #fff;
      border: none;
      font-size: 1.1rem;
      padding: 0.8rem 1.4rem;
      border-radius: 0.8rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="500" height="500"></canvas>
  <button id="permissionBtn" style="display:none;">Enable Motion</button>

  <script>
    const riveFile = "tag_gyro.riv";
    const stateMachineName = "State Machine 1";

    const canvas = document.getElementById("riveCanvas");
    const button = document.getElementById("permissionBtn");

    // --- Professional Gyroscope Processing ---
    class GyroProcessor {
      constructor() {
        // Smoothing parameters - increased for more responsive motion
        this.smoothingFactor = 0.35; // Higher = more responsive
        this.currentValue = 0;
        this.targetValue = 0;
        
        // Calibration
        this.calibrationSamples = [];
        this.maxCalibrationSamples = 30;
        this.isCalibrated = false;
        this.baselineOffset = 0;
        
        // Noise filtering - reduced for more sensitivity
        this.noiseThreshold = 0.2; // Lower = more sensitive
        this.previousRaw = 0;
        
        // Range mapping - now normalized to -1.0 to +1.0
        this.inputMin = -45;
        this.inputMax = 45;
        this.deadZone = 0.5; // Minimal dead zone
        
        // Animation loop
        this.animationFrameId = null;
        this.startSmoothingLoop();
      }

      // Exponential moving average for buttery smooth motion
      smooth(current, target, factor) {
        return current + (target - current) * factor;
      }

      // Calibrate device to find neutral position
      calibrate(rawValue) {
        if (this.isCalibrated) return;
        
        this.calibrationSamples.push(rawValue);
        
        if (this.calibrationSamples.length >= this.maxCalibrationSamples) {
          // Calculate average as baseline
          const sum = this.calibrationSamples.reduce((a, b) => a + b, 0);
          this.baselineOffset = sum / this.calibrationSamples.length;
          this.isCalibrated = true;
          console.log(`📐 Calibrated. Baseline offset: ${this.baselineOffset.toFixed(2)}°`);
        }
      }

      // Process raw gyroscope input
      processInput(rawGamma) {
        if (rawGamma === null) return this.currentValue;
        
        // Calibration phase
        if (!this.isCalibrated) {
          this.calibrate(rawGamma);
          return 0; // Return neutral during calibration
        }
        
        // Apply baseline offset
        let adjusted = rawGamma - this.baselineOffset;
        
        // Noise filtering - ignore micro-movements
        const delta = Math.abs(adjusted - this.previousRaw);
        if (delta < this.noiseThreshold) {
          adjusted = this.previousRaw;
        }
        this.previousRaw = adjusted;
        
        // Apply dead zone for center stability
        if (Math.abs(adjusted) < this.deadZone) {
          adjusted = 0;
        }
        
        // Clamp to input range
        adjusted = Math.max(this.inputMin, Math.min(this.inputMax, adjusted));
        
        // Normalize to -1.0 to +1.0 range for gyroX
        const normalized = adjusted / 45.0;
        
        // Set as target for smooth interpolation
        this.targetValue = normalized;
        
        return this.currentValue;
      }

      // Animation loop for smooth interpolation
      startSmoothingLoop() {
        const animate = () => {
          // Smooth towards target
          this.currentValue = this.smooth(
            this.currentValue,
            this.targetValue,
            this.smoothingFactor
          );
          
          this.animationFrameId = requestAnimationFrame(animate);
        };
        animate();
      }

      getValue() {
        return this.currentValue;
      }

      destroy() {
        if (this.animationFrameId) {
          cancelAnimationFrame(this.animationFrameId);
        }
      }
    }

    // Initialize gyroscope processor
    const gyroProcessor = new GyroProcessor();

    // --- Initialize Rive ---
    const riveInstance = new rive.Rive({
      src: riveFile,
      canvas: canvas,
      autoplay: true,
      autoBind: true,
      stateMachines: stateMachineName,
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center,
      useOffscreenRenderer: true,
      onLoad: () => {
        console.log("✅ Rive 500x500 loaded");
        
        riveInstance.resizeDrawingSurfaceToCanvas();
        
        // Get View Model Instance
        const vmi = riveInstance.viewModelInstance;
        if (!vmi) {
          console.error("❌ No ViewModelInstance found!");
          return;
        }
        
        console.log("✅ View Model Instance connected");
        
        // Define View Model properties for timeline control
        const gyroXProp = vmi.number("gyroX");
        const clickTrigger = vmi.trigger("click");
        
        console.log("✅ View Model properties defined:", {
          gyroX: gyroXProp,
          click: clickTrigger
        });
        
        startRiveUpdateLoop(vmi, gyroXProp);
      },
    });

    // --- Continuous update loop for Rive ---
    function startRiveUpdateLoop(vmi, gyroXProp) {
      const totalFrames = 60; // Your timeline has 60 frames
      const centerFrame = 30; // Center/neutral position at frame 30
      
      let frameCount = 0;
      
      function update() {
        const gyroX = gyroProcessor.getValue();
        
        // Map gyroX (-1.0 to +1.0) to frame range (0 to 60)
        // gyroX = -1.0 → frame 0 (full left)
        // gyroX =  0.0 → frame 30 (neutral)
        // gyroX = +1.0 → frame 60 (full right)
        const targetFrame = centerFrame + (gyroX * centerFrame);
        
        // Clamp to valid frame range
        const clampedFrame = Math.max(0, Math.min(totalFrames, targetFrame));
        
        // Update gyroX property (this will drive your timeline in Rive)
        if (gyroXProp) {
          gyroXProp.value = clampedFrame;
        }
        
        // Debug logging every 60 frames (~1 second)
        if (frameCount % 60 === 0) {
          console.log(`🎯 gyroX: ${gyroX.toFixed(3)} | Target Frame: ${clampedFrame.toFixed(1)}`);
        }
        frameCount++;
        
        requestAnimationFrame(update);
      }
      update();
    }

    // --- Handle motion permission (iOS) ---
    function setupMotion() {
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        button.style.display = "block";
        button.onclick = () => {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === "granted") {
                button.style.display = "none";
                window.addEventListener("deviceorientation", handleOrientation);
              } else {
                alert("Motion access denied");
              }
            })
            .catch(console.error);
        };
      } else {
        window.addEventListener("deviceorientation", handleOrientation);
      }
    }

    function handleOrientation(event) {
      const { gamma } = event;
      gyroProcessor.processInput(gamma);
    }

    setupMotion();

    // Cleanup on page unload
    window.addEventListener("beforeunload", () => {
      gyroProcessor.destroy();
    });
  </script>
</body>
</html>
