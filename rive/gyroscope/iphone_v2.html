<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rive Gyroscope (500x500)</title>
  <script src="https://unpkg.com/@rive-app/webgl2@latest"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a1a;
    }

    canvas {
      max-width: 500px;
      max-height: 500px;
    }

    #startButton {
      position: absolute;
      padding: 16px 32px;
      font-size: 18px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <button id="startButton">Enable Gyroscope</button>
  <div id="status">Loading...</div>
  
  <script>
    const statusDiv = document.getElementById('status');
    
    function updateStatus(msg) {
      console.log(msg);
      statusDiv.textContent = msg;
    }
    
    async function init() {
      try {
        updateStatus('Initializing Rive WebGL2...');
        
        const canvas = document.getElementById('canvas');
        
        // Load the low-level WebGL2 runtime
        const riveInstance = await window.rive.RuntimeLoader.awaitInstance();
        
        updateStatus('Loading .riv file...');
        const bytes = await (await fetch('tag_gyro.riv')).arrayBuffer();
        const file = await riveInstance.load(new Uint8Array(bytes));
        const artboard = file.defaultArtboard();
        
        updateStatus('Creating animation...');
        const animation = new riveInstance.LinearAnimationInstance(
          artboard.animationByName('rotation_timeline'),
          artboard
        );
        
        const renderer = riveInstance.makeRenderer(canvas);
        
        // Animation config
        const TOTAL_FRAMES = 60;
        const FPS = 60;
        const animationDuration = TOTAL_FRAMES / FPS;
        
        // Gyroscope config
        let neutralBeta = null;
        const TILT_RANGE = 45;
        
        // Start at frame 30 (neutral)
        let currentTime = (30 / TOTAL_FRAMES) * animationDuration;
        
        function handleOrientation(event) {
          const rotationX = event.beta || 0;
          
          if (neutralBeta === null) {
            neutralBeta = rotationX;
            updateStatus(`Calibrated! Neutral: ${neutralBeta.toFixed(1)}°`);
          }
          
          const offset = rotationX - neutralBeta;
          const clamped = Math.max(-TILT_RANGE, Math.min(TILT_RANGE, offset));
          const normalized = (clamped + TILT_RANGE) / (TILT_RANGE * 2);
          
          currentTime = normalized * animationDuration;
          
          const currentFrame = normalized * TOTAL_FRAMES;
          updateStatus(`Beta: ${rotationX.toFixed(1)}° | Offset: ${offset.toFixed(1)}° | Frame: ${currentFrame.toFixed(1)}`);
        }
        
        function renderLoop() {
          renderer.clear();
          
          animation.time = currentTime;
          animation.apply(1.0);
          artboard.advance(0);
          
          renderer.save();
          renderer.align(
            riveInstance.Fit.contain,
            riveInstance.Alignment.center,
            {
              minX: 0,
              minY: 0,
              maxX: canvas.width,
              maxY: canvas.height
            },
            artboard.bounds
          );
          artboard.draw(renderer);
          renderer.restore();
          renderer.flush();
          
          requestAnimationFrame(renderLoop);
        }
        
        async function requestGyroscopePermission() {
          if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
              const permission = await DeviceOrientationEvent.requestPermission();
              if (permission === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation);
                updateStatus('Gyroscope enabled! Calibrating...');
                return true;
              } else {
                updateStatus('Permission denied');
                return false;
              }
            } catch (e) {
              updateStatus('Error: ' + e.message);
              return false;
            }
          } else {
            window.addEventListener('deviceorientation', handleOrientation);
            updateStatus('Gyroscope enabled! Calibrating...');
            return true;
          }
        }
        
        const startButton = document.getElementById('startButton');
        startButton.addEventListener('click', async () => {
          await requestGyroscopePermission();
          startButton.style.display = 'none';
        });
        
        updateStatus('Ready! Click button to enable gyroscope.');
        renderLoop();
        
      } catch (err) {
        updateStatus('Error: ' + err.message);
        console.error(err);
      }
    }
    
    window.addEventListener('load', () => {
      setTimeout(init, 100);
    });
  </script>
</body>
</html>
