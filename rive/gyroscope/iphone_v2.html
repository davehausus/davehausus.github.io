<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rive Gyroscope (500x500)</title>
  <script src="https://unpkg.com/@rive-app/canvas@2.7.0"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a1a;
    }

    canvas {
      max-width: 500px;
      max-height: 500px;
    }

    #startButton {
      position: absolute;
      padding: 16px 32px;
      font-size: 18px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <button id="startButton">Enable Gyroscope</button>
  <div id="status">Loading...</div>
  
  <script>
    const statusDiv = document.getElementById('status');
    
    function updateStatus(msg) {
      console.log(msg);
      statusDiv.textContent = msg;
    }
    
    async function init() {
      try {
        updateStatus('Initializing Rive...');
        
        const canvas = document.getElementById('canvas');
        const riveInstance = new rive.Rive({
          src: 'tag_gyro.riv',
          canvas: canvas,
          autoplay: false,
          stateMachines: [],
          onLoad: () => {
            updateStatus('Rive loaded. Click button to enable gyroscope.');
            
            const artboard = riveInstance.artboard;
            const animation = artboard.animationByName('rotation_timeline');
            
            if (!animation) {
              updateStatus('Error: Animation "rotation_timeline" not found');
              return;
            }
            
            // Animation config
            const TOTAL_FRAMES = 60;
            const FPS = 60;
            const animationDuration = TOTAL_FRAMES / FPS;
            
            // Gyroscope config
            const MIN_ANGLE = -90;
            const MAX_ANGLE = 90;
            
            // Start at neutral
            let targetTime = animationDuration / 2;
            
            function handleOrientation(event) {
              const rotationX = event.beta || 0;
              
              // Clamp and normalize
              const clamped = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, rotationX));
              const normalized = (clamped - MIN_ANGLE) / (MAX_ANGLE - MIN_ANGLE);
              
              // Map to animation time
              targetTime = normalized * animationDuration;
              
              updateStatus(`Beta: ${rotationX.toFixed(1)}° | Frame: ${(normalized * TOTAL_FRAMES).toFixed(1)}`);
            }
            
            // Manual animation loop
            function animationLoop() {
              if (riveInstance.animator && riveInstance.animator.instances.length > 0) {
                riveInstance.animator.instances[0].time = targetTime;
                riveInstance.animator.instances[0].advance(0);
                riveInstance.animator.instances[0].apply(1.0);
              }
              riveInstance.drawFrame();
              requestAnimationFrame(animationLoop);
            }
            
            // iOS 13+ requires permission request
            async function requestGyroscopePermission() {
              if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                  const permission = await DeviceOrientationEvent.requestPermission();
                  if (permission === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation);
                    updateStatus('Gyroscope enabled! Tilt your device.');
                    animationLoop();
                    return true;
                  } else {
                    updateStatus('Permission denied');
                    return false;
                  }
                } catch (e) {
                  updateStatus('Error: ' + e.message);
                  return false;
                }
              } else {
                // Android and older iOS
                window.addEventListener('deviceorientation', handleOrientation);
                updateStatus('Gyroscope enabled! Tilt your device.');
                animationLoop();
                return true;
              }
            }
            
            // Button handler
            const startButton = document.getElementById('startButton');
            startButton.addEventListener('click', async () => {
              await requestGyroscopePermission();
              startButton.style.display = 'none';
            });
          },
          onLoadError: (err) => {
            updateStatus('Failed to load: ' + err);
          }
        });
      } catch (err) {
        updateStatus('Init error: ' + err.message);
      }
    }
    
    // Wait for Rive library
    if (typeof rive !== 'undefined') {
      init();
    } else {
      window.addEventListener('load', init);
    }
  </script>
</body>
</html>
