<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rive Gyroscope (Android)</title>
  <script src="https://unpkg.com/@rive-app/canvas@2.21.7"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Fixed 500x500 Rive canvas */
    canvas {
      width: 500px;
      height: 500px;
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
    }

    /* Optional message overlay for devices without motion sensors */
    #noMotion {
      position: absolute;
      bottom: 2rem;
      color: white;
      font-family: sans-serif;
      font-size: 1rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="500" height="500"></canvas>
  <div id="noMotion" style="display:none;">No motion sensors detected</div>

  <script>
    const riveFile = "tag_gyro.riv";
    const stateMachineName = "State Machine 1";
    const inputName = "tiltX";

    const canvas = document.getElementById("riveCanvas");
    const noMotionMsg = document.getElementById("noMotion");

    // --- Initialize Rive ---
    const riveInstance = new rive.Rive({
      src: riveFile,
      canvas: canvas,
      autoplay: true,
      stateMachines: stateMachineName,
      fit: rive.Fit.CONTAIN,
      alignment: rive.Alignment.CENTER,
      onLoad: () => console.log("✅ Rive 500x500 loaded (Android)"),
    });

    // --- Update Rive input based on tilt ---
    function updateTilt(gamma) {
      const clampedTilt = Math.max(-45, Math.min(45, gamma));
      const inputs = riveInstance.stateMachineInputs(stateMachineName);
      const tiltX = inputs.find(i => i.name === inputName);
      if (tiltX) tiltX.value = clampedTilt;
    }

    // --- Detect and handle device motion events ---
    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", event => {
        const { gamma } = event; // left-right rotation in degrees
        if (gamma !== null) {
          updateTilt(gamma);
        } else {
          noMotionMsg.style.display = "block";
        }
      });
    } else {
      noMotionMsg.style.display = "block";
    }
  </script>
</body>
</html>
