<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rive Gyroscope (500x500)</title>
  <script src="https://unpkg.com/@rive-app/canvas@2.21.7"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Fixed-size Rive canvas */
    canvas {
      width: 500px;
      height: 500px;
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
    }

    #permissionBtn {
      position: absolute;
      bottom: 2rem;
      background: #fff;
      border: none;
      font-size: 1.1rem;
      padding: 0.8rem 1.4rem;
      border-radius: 0.8rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <canvas id="riveCanvas" width="500" height="500"></canvas>
  <button id="permissionBtn" style="display:none;">Enable Motion</button>

  <script>
    const riveFile = "tag_gyro.riv";
    const stateMachineName = "State Machine 1";
    const inputName = "tiltX";

    const canvas = document.getElementById("riveCanvas");
    const button = document.getElementById("permissionBtn");

    // --- Initialize Rive ---
    const riveInstance = new rive.Rive({
      src: riveFile,
      canvas: canvas,
      autoplay: true,
      stateMachines: stateMachineName,
      fit: rive.Fit.CONTAIN,
      alignment: rive.Alignment.CENTER,
      onLoad: () => {
        console.log("✅ Rive 500x500 loaded");
      },
    });

    // --- Update Rive input based on gyroscope ---
    function updateTilt(gamma) {
      const clampedTilt = Math.max(-45, Math.min(45, gamma));
      const inputs = riveInstance.stateMachineInputs(stateMachineName);
      const tiltX = inputs.find(i => i.name === inputName);
      if (tiltX) tiltX.value = clampedTilt;
    }

    // --- Handle motion permission (iOS) ---
    function setupMotion() {
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        button.style.display = "block";
        button.onclick = () => {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === "granted") {
                button.style.display = "none";
                window.addEventListener("deviceorientation", handleOrientation);
              } else {
                alert("Motion access denied");
              }
            })
            .catch(console.error);
        };
      } else {
        window.addEventListener("deviceorientation", handleOrientation);
      }
    }

    function handleOrientation(event) {
      const { gamma } = event;
      if (gamma !== null) updateTilt(gamma);
    }

    setupMotion();
  </script>
</body>
</html>
