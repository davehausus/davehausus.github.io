    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a1a;

      max-width: 500px;
      max-height: 500px;
    }

    #startButton {
      position: absolute;
      padding: 16px 32px;
      font-size: 18px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>

<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <button id="startButton">Enable Gyroscope</button>
  <div id="status">Loading...</div>


<script>
    const statusDiv = document.getElementById('status');
    
    function updateStatus(msg) {
        console.log(msg);
        statusDiv.textContent = msg;
    }
    
    async function init() {
        try {
            updateStatus('Initializing Rive WebGL2...');
            
            const canvas = document.getElementById('canvas');
            
            // Load the low-level WebGL2 runtime
            const riveInstance = await window.rive.RuntimeLoader.awaitInstance();
            
            updateStatus('Loading .riv file...');
            const bytes = await (await fetch('tag_gyro.riv')).arrayBuffer();
            const file = await riveInstance.load(new Uint8Array(bytes));
            const artboard = file.defaultArtboard();
            
            updateStatus('Creating animation...');
            const animation = new riveInstance.LinearAnimationInstance(
                artboard.animationByName('rotation_timeline'),
                artboard
            );
            
            // ========================================
            // STATE MACHINE SETUP
            // ========================================
            
            updateStatus('Setting up state machine...');
            const stateMachine = artboard.stateMachineByName('State Machine 1');
            let stateMachineInstance = null;
            let clickTrigger = null;
            
            if (stateMachine) {
                stateMachineInstance = new riveInstance.StateMachineInstance(stateMachine, artboard);
                
                // Find the click_trigger input
                for (let i = 0; i < stateMachineInstance.inputCount(); i++) {
                    const input = stateMachineInstance.input(i);
                    
                    if (input.name === 'click_trigger') {
                        clickTrigger = input.asTrigger();
                        updateStatus('Found click_trigger!');
                        break;
                    }
                }
                
                if (!clickTrigger) {
                    console.warn('click_trigger not found in state machine');
                }
            } else {
                console.warn('State Machine 1 not found');
            }
            
            const renderer = riveInstance.makeRenderer(canvas);
            
            // Animation config
            const TOTAL_FRAMES = 60;
            const FPS = 60;
            const animationDuration = TOTAL_FRAMES / FPS;
            
            // Professional Gyroscope Processing
            let neutralGamma = null;
            const TILT_RANGE = 45;
            const SMOOTHING_FACTOR = 0.15; // Low-pass filter (0-1, lower = smoother)
            const DEADZONE = 0.5; // Degrees - ignore micro-movements
            
            let smoothedValue = 0;
            let rawBuffer = [];
            const BUFFER_SIZE = 5;
            
            // Start at frame 30 (neutral)
            let currentTime = (30 / TOTAL_FRAMES) * animationDuration;
            
            // Track delta time for state machine
            let lastFrameTime = performance.now();
            
            function handleOrientation(event) {
                const rotationY = event.gamma || 0;
                
                if (neutralGamma === null) {
                    neutralGamma = rotationY;
                    smoothedValue = 0;
                    updateStatus(`Calibrated! Neutral: ${neutralGamma.toFixed(1)}°`);
                }
                
                // Calculate offset from neutral
                let offset = rotationY - neutralGamma;
                
                // Apply deadzone
                if (Math.abs(offset) < DEADZONE) {
                    offset = 0;
                }
                
                // Moving average filter
                rawBuffer.push(offset);
                if (rawBuffer.length > BUFFER_SIZE) {
                    rawBuffer.shift();
                }
                const avgOffset = rawBuffer.reduce((a, b) => a + b, 0) / rawBuffer.length;
                
                // Exponential smoothing (low-pass filter)
                smoothedValue = smoothedValue + SMOOTHING_FACTOR * (avgOffset - smoothedValue);
                
                // Clamp to range
                const clamped = Math.max(-TILT_RANGE, Math.min(TILT_RANGE, smoothedValue));
                
                // Normalize to 0-1
                const normalized = (clamped + TILT_RANGE) / (TILT_RANGE * 2);
                
                currentTime = normalized * animationDuration;
                
                const currentFrame = normalized * TOTAL_FRAMES;
                updateStatus(`Gamma: ${rotationY.toFixed(1)}° | Smoothed: ${smoothedValue.toFixed(1)}° | Frame: ${currentFrame.toFixed(1)}`);
            }
            
            function renderLoop(currentFrameTime) {
                // Calculate delta time for state machine
                const deltaTime = (currentFrameTime - lastFrameTime) / 1000;
                lastFrameTime = currentFrameTime;
                
                renderer.clear();
                
                // Apply linear animation for rotation control
                animation.time = currentTime;
                animation.apply(1.0);
                
                // Advance state machine (processes triggers)
                if (stateMachineInstance) {
                    stateMachineInstance.advance(deltaTime);
                }
                
                artboard.advance(deltaTime);
                renderer.save();
                renderer.align(
                    riveInstance.Fit.contain,
                    riveInstance.Alignment.center,
                    {
                        minX: 0,
                        minY: 0,
                        maxX: canvas.width,
                        maxY: canvas.height
                    },
                    artboard.bounds
                );
                artboard.draw(renderer);
                renderer.restore();
                renderer.flush();
                
                requestAnimationFrame(renderLoop);
            }
            
            // ========================================
            // POINTER EVENTS FOR TRIGGERS - Need 3 arguments: x, y, pointerId
            // ========================================
            
            function getCanvasCoordinates(event) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                const clientX = event.clientX ?? event.touches?.[0]?.clientX ?? 0;
                const clientY = event.clientY ?? event.touches?.[0]?.clientY ?? 0;
                
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY,
                };
            }
            
            // For state machine hit detection (if you have listeners in Rive)
            canvas.addEventListener('pointerdown', (event) => {
                if (stateMachineInstance) {
                    const coords = getCanvasCoordinates(event);
                    const hitDetected = stateMachineInstance.pointerDown(coords.x, coords.y, event.pointerId);
                    
                    // If hit detected and trigger exists, fire it
                    if (hitDetected && clickTrigger) {
                        clickTrigger.fire();
                        updateStatus('Trigger fired on hit!');
                    }
                }
            });
            
            canvas.addEventListener('pointerup', (event) => {
                if (stateMachineInstance) {
                    const coords = getCanvasCoordinates(event);
                    stateMachineInstance.pointerUp(coords.x, coords.y, event.pointerId);
                }
            });
            
            canvas.addEventListener('pointermove', (event) => {
                if (stateMachineInstance) {
                    const coords = getCanvasCoordinates(event);
                    stateMachineInstance.pointerMove(coords.x, coords.y, event.pointerId);
                }
            });
            
            
            
            // ========================================
            // PUBLIC FUNCTION TO FIRE TRIGGER
            // ========================================
            
            // Expose function globally so you can call it from anywhere
            window.fireClickTrigger = function() {
                if (clickTrigger) {
                    clickTrigger.fire();
                    console.log('click_trigger fired!');
                } else {
                    console.warn('click_trigger not available');
                }
            };
            
            async function requestGyroscopePermission() {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            updateStatus('Gyroscope enabled! Calibrating...');
                            return true;
                        } else {
                            updateStatus('Permission denied');
                            return false;
                        }
                        } catch (e) {
                            updateStatus('Error: ' + e.message);
                            return false;
                        }
                        } else {
                            window.addEventListener('deviceorientation', handleOrientation);
                            updateStatus('Gyroscope enabled! Calibrating...');
                            return true;
                        }
            }
            
            const startButton = document.getElementById('startButton');
            startButton.addEventListener('click', async () => {
                await requestGyroscopePermission();
                startButton.style.display = 'none';
            });
            
            updateStatus('Ready! Click button to enable gyroscope.');
            requestAnimationFrame(renderLoop);
            
            } catch (err) {
                updateStatus('Error: ' + err.message);
                console.error(err);
            }
        }
        
        window.addEventListener('load', () => {
            setTimeout(init, 100);
        });
</script>
</body>
