<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rive Gyroscope (500x500)</title>
  <script src="https://unpkg.com/@rive-app/webgl2@latest"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a1a;
    }

    canvas {
      max-width: 500px;
      max-height: 500px;
    }

    #startButton {
      position: absolute;
      padding: 16px 32px;
      font-size: 18px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <button id="startButton">Enable Gyroscope</button>
  <div id="status">Loading...</div>
  
<script>
    const statusDiv = document.getElementById('status');
    
    function updateStatus(msg) {
      console.log(msg);
      statusDiv.textContent = msg;
    }
    
    async function init() {
      try {
        updateStatus('Initializing Rive WebGL2...');
        
        const canvas = document.getElementById('canvas');
        
        // Load the low-level WebGL2 runtime
        const riveInstance = await window.rive.RuntimeLoader.awaitInstance();
        
        updateStatus('Loading .riv file...');
        const bytes = await (await fetch('tag_gyro.riv')).arrayBuffer();
        const file = await riveInstance.load(new Uint8Array(bytes));
        const artboard = file.defaultArtboard();
        
        updateStatus('Creating animation and inputs...');
        const animation = new riveInstance.LinearAnimationInstance(
          artboard.animationByName('rotation_timeline'),
          artboard
        );
        
        // Define trigger input
        const clickTrigger = artboard.inputByName('click_trigger');
        
        const renderer = riveInstance.makeRenderer(canvas);
        
        // Animation config
        const TOTAL_FRAMES = 60;
        const FPS = 60;
        const animationDuration = TOTAL_FRAMES / FPS;
        
        // Professional Gyroscope Processing
        let neutralGamma = null;
        const TILT_RANGE = 45;
        const SMOOTHING_FACTOR = 0.15; // Low-pass filter coefficient
        const DEADZONE = 0.5; // Ignore small movements
        
        let smoothedValue = 0;
        let targetTime = (30 / TOTAL_FRAMES) * animationDuration; // Start at neutral frame 30
        let currentTime = targetTime;
        
        // Exponential moving average for smoothing
        function smoothValue(current, target, factor) {
          return current + (target - current) * factor;
        }
        
        function handleOrientation(event) {
          const rotationY = event.gamma || 0; // Y-axis rotation (left-right tilt)
          
          // Calibration on first reading
          if (neutralGamma === null) {
            neutralGamma = rotationY;
            smoothedValue = 0;
            updateStatus(`Calibrated! Neutral: ${neutralGamma.toFixed(1)}°`);
            return;
          }
          
          // Calculate offset from neutral
          let offset = rotationY - neutralGamma;
          
          // Apply deadzone to reduce jitter
          if (Math.abs(offset) < DEADZONE) {
            offset = 0;
          }
          
          // Clamp to range
          const clamped = Math.max(-TILT_RANGE, Math.min(TILT_RANGE, offset));
          
          // Apply smoothing filter
          smoothedValue = smoothValue(smoothedValue, clamped, SMOOTHING_FACTOR);
          
          // Normalize to 0-1 range
          const normalized = (smoothedValue + TILT_RANGE) / (TILT_RANGE * 2);
          
          // Update target time
          targetTime = normalized * animationDuration;
          
          const currentFrame = normalized * TOTAL_FRAMES;
          updateStatus(`Gamma: ${rotationY.toFixed(1)}° | Offset: ${offset.toFixed(1)}° | Smoothed: ${smoothedValue.toFixed(1)}° | Frame: ${currentFrame.toFixed(1)}`);
        }
        
        function renderLoop() {
          renderer.clear();
          
          // Smooth interpolation toward target time
          currentTime = smoothValue(currentTime, targetTime, 0.2);
          
          animation.time = currentTime;
          animation.apply(1.0);
          artboard.advance(0);
          
          renderer.save();
          renderer.align(
            riveInstance.Fit.contain,
            riveInstance.Alignment.center,
            {
              minX: 0,
              minY: 0,
              maxX: canvas.width,
              maxY: canvas.height
            },
            artboard.bounds
          );
          artboard.draw(renderer);
          renderer.restore();
          renderer.flush();
          
          requestAnimationFrame(renderLoop);
        }
        
        async function requestGyroscopePermission() {
          if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
              const permission = await DeviceOrientationEvent.requestPermission();
              if (permission === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation);
                updateStatus('Gyroscope enabled! Calibrating...');
                return true;
              } else {
                updateStatus('Permission denied');
                return false;
              }
            } catch (e) {
              updateStatus('Error: ' + e.message);
              return false;
            }
          } else {
            window.addEventListener('deviceorientation', handleOrientation);
            updateStatus('Gyroscope enabled! Calibrating...');
            return true;
          }
        }
        
        const startButton = document.getElementById('startButton');
        startButton.addEventListener('click', async () => {
          await requestGyroscopePermission();
          startButton.style.display = 'none';
        });
        
        updateStatus('Ready! Click button to enable gyroscope.');
        renderLoop();
        
      } catch (err) {
        updateStatus('Error: ' + err.message);
        console.error(err);
      }
    }
    
    window.addEventListener('load', () => {
      setTimeout(init, 100);
    });
  </script>
  </body>
</html>
